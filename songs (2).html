<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мої пісні</title>
<style>
  :root {
    --bg: #14121a;
    --panel: #1d1a26;
    --panel-2: #262233;
    --text: #ece9f3;
    --muted: #9a94ad;
    --accent: #f2a54a;
    --accent-2: #e0663b;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    background: radial-gradient(1200px 600px at 10% -10%, #2a2140 0%, transparent 60%), var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header { padding: 32px 20px 12px; text-align: center; }
  header h1 {
    margin: 0; font-size: clamp(28px, 5vw, 44px); letter-spacing: .5px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  header p { margin: 8px 0 0; color: var(--muted); }

  .layout {
    max-width: 1100px; margin: 20px auto 40px; padding: 0 16px;
    display: grid; grid-template-columns: 340px 1fr; gap: 20px;
  }
  .list, .viewer {
    background: var(--panel); border-radius: var(--radius);
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  .list { padding: 10px; align-self: start; }
  .song {
    display: flex; align-items: center; gap: 12px; width: 100%;
    padding: 12px 14px; border: 0; background: transparent; color: var(--text);
    font: inherit; text-align: left; cursor: pointer; border-radius: 10px;
    transition: background .15s, transform .15s;
  }
  .song:hover { background: var(--panel-2); transform: translateX(3px); }
  .song.active { background: linear-gradient(90deg, rgba(242,165,74,.22), rgba(224,102,59,.12)); outline: 1px solid rgba(242,165,74,.4); }
  .num {
    flex: 0 0 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
    background: var(--panel-2); color: var(--accent); font-size: 13px; font-weight: 700;
  }
  .song.active .num { background: var(--accent); color: #1a1208; }
  .title { font-weight: 600; }
  .sub { display: block; font-size: 12px; color: var(--muted); font-weight: 400; margin-top: 2px; }

  .viewer { padding: 26px 28px; min-height: 360px; }
  .viewer h2 { margin: 0 0 4px; font-size: 28px; }
  .viewer .sub { margin-bottom: 18px; }
  .empty { color: var(--muted); text-align: center; padding: 70px 10px; }
  .lyrics { white-space: pre-wrap; line-height: 1.75; font-size: 17px; }
  .notice {
    background: var(--panel-2); border-left: 3px solid var(--accent);
    padding: 12px 14px; border-radius: 8px; color: var(--muted); margin-bottom: 14px; font-size: 14px;
  }
  textarea {
    width: 100%; min-height: 280px; resize: vertical; padding: 14px;
    background: #15131c; color: var(--text); border: 1px solid #38334a; border-radius: 10px;
    font: inherit; line-height: 1.6;
  }
  textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
  .btn {
    border: 0; border-radius: 10px; padding: 10px 16px; font: inherit; font-weight: 600;
    cursor: pointer; text-decoration: none; display: inline-block;
    background: var(--panel-2); color: var(--text);
  }
  .btn.primary { background: linear-gradient(90deg, var(--accent), var(--accent-2)); color: #1a1208; }
  .btn:hover { filter: brightness(1.12); }
  .back { display: none; margin-bottom: 14px; }

  .tabs { display: flex; justify-content: center; gap: 8px; margin: 14px 16px 0; flex-wrap: wrap; }
  .tab {
    border: 0; border-radius: 999px; padding: 10px 20px; font: inherit; font-weight: 600;
    cursor: pointer; background: var(--panel); color: var(--muted);
  }
  .tab.active { background: linear-gradient(90deg, var(--accent), var(--accent-2)); color: #1a1208; }

  .program {
    max-width: 700px; margin: 20px auto 40px; padding: 10px;
    background: var(--panel); border-radius: var(--radius); box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  .program h2 { margin: 14px 14px 8px; }
  .item {
    display: flex; align-items: center; gap: 12px; width: 100%;
    padding: 12px 14px; border: 0; background: transparent; color: var(--text);
    font: inherit; text-align: left; border-radius: 10px;
  }
  button.item { cursor: pointer; transition: background .15s, transform .15s; }
  button.item:hover { background: var(--panel-2); transform: translateX(3px); }
  .item.game { background: rgba(224,102,59,.10); border: 1px dashed rgba(224,102,59,.5); margin: 4px 0; }
  .badge {
    margin-left: auto; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px;
    background: var(--accent-2); color: #1a1208; white-space: nowrap;
  }
  .hint { color: var(--muted); font-size: 13px; margin: 0 14px 10px; }

  .games { max-width: 700px; margin: 20px auto 40px; padding: 10px 16px; }
  .games h2 { margin: 14px 0 8px; }
  .game-card {
    background: var(--panel); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35); border-left: 4px solid var(--accent-2);
  }
  .game-card h3 { margin: 0 0 10px; font-size: 20px; }
  .game-card .rules { white-space: pre-wrap; line-height: 1.65; }
  .game-card textarea { min-height: 120px; }

  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; }
    body.reading .list { display: none; }
    body:not(.reading) .viewer { display: none; }
    .back { display: inline-block; }
    .viewer { padding: 20px 18px; }
  }
</style>
</head>
<body>
<header>
  <h1>🎵 Мої пісні</h1>
  <p>Обери пісню зі списку, щоб побачити текст</p>
</header>

<div class="tabs">
  <button class="tab active" id="tabSongs">Пісні</button>
  <button class="tab" id="tabGames">Ігри</button>
</div>

<main class="layout" id="songsView">
  <nav class="list" id="list" aria-label="Список пісень"></nav>
  <section class="viewer" id="viewer" aria-live="polite"></section>
</main>

<section class="program" id="gamesView" hidden>
  <h2>🎲 Ігри</h2>
  <div id="gamesList"></div>
</section>

<script>
  // Вставте тексти пісень сюди (між зворотними лапками ``) 
  // або прямо на сторінці — вони збережуться у браузері.
  const songs = [
    { title: "Берег ріки",              lyrics: `` },
    { title: "Бета каротин",            lyrics: `` },
    { title: "Пісня на замовлення",     lyrics: `` },
    { title: "Мексиканець",             lyrics: `` },
    { title: "Вона",                    lyrics: `` },
    { title: "Вечорниці", sub: "Тембр Бланш", lyrics: `` },
    { title: "Човен", sub: "Один в каное", lyrics: `` },
    { title: "Водограй",                lyrics: `` },
    { title: "Надія є",                 lyrics: `` },
    { title: "Гуцулка Ксеня",           lyrics: `` },
    { title: "Пісня буде поміж нас",    lyrics: `` }
  ];

  const listEl = document.getElementById("list");
  const viewerEl = document.getElementById("viewer");
  let current = -1;

  const load = i => songs[i].lyrics;

  function renderList() {
    listEl.innerHTML = "";
    songs.forEach((s, i) => {
      const b = document.createElement("button");
      b.className = "song" + (i === current ? " active" : "");
      b.innerHTML = `<span class="num">${i + 1}</span><span class="title">${s.title}${s.sub ? `<span class="sub">${s.sub}</span>` : ""}</span>`;
      b.onclick = () => open(i);
      listEl.appendChild(b);
    });
  }

  function open(i, editing = false) {
    current = i;
    document.body.classList.add("reading");
    renderList();
    const s = songs[i];
    const text = load(i).trim();
    const head = `<button class="btn back" id="back">← До списку</button>
      <h2>${s.title}</h2><div class="sub">${s.sub || ""}</div>`;

    if (text) {
      viewerEl.innerHTML = head + `<div class="lyrics"></div>`;
      viewerEl.querySelector(".lyrics").textContent = text;
    } else {
      viewerEl.innerHTML = head + `<div class="notice">Тексту цієї пісні поки немає.</div>`;
    }
    document.getElementById("back").onclick = () => {
      document.body.classList.remove("reading");
      window.scrollTo(0, 0);
    };
  }

  function showEmpty() {
    viewerEl.innerHTML = `<div class="empty">← Натисніть на пісню, щоб побачити її текст</div>`;
  }

  // ---------- Ігри ----------
  const games = [
    "Польське весілля",
    "Нехай зігріє мене той",
    "Коди",
    "Скажи, кого кохаєш ти"
  ];

  const gamesEl = document.getElementById("gamesList");
  games.forEach((g, n) => {
    const el = document.createElement("div");
    el.className = "item game";
    el.innerHTML = `<span class="num">${n + 1}</span><span class="title"></span><span class="badge">🎲 Гра</span>`;
    el.querySelector(".title").textContent = g;
    gamesEl.appendChild(el);
  });

  // ---------- Вкладки ----------
  function showTab(name) {
    document.getElementById("songsView").hidden = name !== "songs";
    document.getElementById("gamesView").hidden = name !== "games";
    document.getElementById("tabSongs").classList.toggle("active", name === "songs");
    document.getElementById("tabGames").classList.toggle("active", name === "games");
    if (name !== "songs") document.body.classList.remove("reading");
    window.scrollTo(0, 0);
  }
  document.getElementById("tabSongs").onclick = () => showTab("songs");
  document.getElementById("tabGames").onclick = () => showTab("games");

  renderList();
  showEmpty();
</script>
</body>
</html>
